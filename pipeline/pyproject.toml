[project]
name = "astra-frontier-pipeline"
version = "0.1.0"
description = "Orbital telemetry harmonization, autoencoder training, and FAISS indexing pipeline for Astra Frontier"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.8.0",
    "global-land-mask>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "planetary-computer>=1.0.0",
    "pyarrow>=15.0.0",
    "pyproj>=3.6.0",
    "pystac-client>=0.7.0",
    "rasterio>=1.3.9",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
]
